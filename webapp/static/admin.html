<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员问卷收件箱</title><link rel="stylesheet" href="/static/site.css"><script defer src="/static/admin.js"></script></head><body><main class="admin-shell"><div class="toolbar"><div><div class="eyebrow">PRIVATE ADMIN</div><h1>问卷收件箱</h1><p class="small">仅授权管理员可见。内部预览尚未通过锁定定稿模板验收，不能作为正式完整版交付。问卷列表登录后每 30 秒自动刷新。</p></div><div><button id="refresh" class="button secondary" hidden>立即刷新</button> <button id="logout" class="button secondary" hidden>退出登录</button></div></div><section id="login" class="card-panel admin-login"><h2>管理员登录</h2><form id="login-form"><label class="field"><span>管理员密码</span><input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><p><button class="button primary" type="submit">登录</button></p><div id="login-error" class="error-text" role="status"></div></form></section><section id="dashboard" hidden><div id="database-version" class="notice small">读取院校数据快照…</div><div id="message" class="notice" hidden></div><div class="table-wrap"><table class="table"><thead><tr><th>提交时间</th><th>学生</th><th>课程体系</th><th>意向</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><h2>问卷详情</h2><pre id="detail" class="detail-box">选择一份问卷查看内容。</pre><h3>已提交附件</h3><div id="attachment-links" class="attachment-list"></div></section></main></body></html>

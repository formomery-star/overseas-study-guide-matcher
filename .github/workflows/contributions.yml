name: Contribution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Validate proposals (no live credentials)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from community_data import read, validate
          for p in Path('contributions').glob('*.json'):
              if p.name != 'example.json':
                  validate(read(p))
                  print(p.name, 'awaiting_review')
          PY
